<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>กล้วยตากคุณย่า รายรับรายจ่าย</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style id="app-style">
/* Mobile-first app column (max 560px). Banana-gold header, dried-banana brown ink; green = money in, orange = money out. Bottom tab bar + bottom sheet for entry. */
:root{
  --bg:#fbf4e4; --surface:#ffffff; --ink:#3b2a14; --muted:#7c6850; --line:#efe2c6;
  --sun:#f5b301; --sun-soft:#fff1c4; --brown:#8a5a1f;
  --inc:#23834f; --inc-soft:#e1f3e7; --exp:#cf5326; --exp-soft:#fde5da;
  --display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#18120a; --surface:#241b10; --ink:#f7ebd3; --muted:#bba889; --line:#3a2e1c;
  --sun:#f7c443; --sun-soft:#3a2e10; --brown:#e3aa5d;
  --inc:#6fd59c; --inc-soft:#153224; --exp:#ff9773; --exp-soft:#3d2015; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#18120a; --surface:#241b10; --ink:#f7ebd3; --muted:#bba889; --line:#3a2e1c;
  --sun:#f7c443; --sun-soft:#3a2e10; --brown:#e3aa5d;
  --inc:#6fd59c; --inc-soft:#153224; --exp:#ff9773; --exp-soft:#3d2015; color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
body.lock{overflow:hidden}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance}
h1{font-size:24px;line-height:1.15}
h2{font-size:19px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14.5px}
select,input,textarea,button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brown);outline-offset:2px}
.col{max-width:560px;margin:0 auto;padding:0 16px}

/* header */
.top{background:var(--sun);color:#3b2a14;padding:14px 0 18px;border-radius:0 0 24px 24px}
.top .col{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:48px;height:48px;border-radius:50%;background:#fff6d6;display:grid;place-items:center;flex:none}
.top .name{flex:1 1 auto;min-width:0}
.top .name p{margin:0;font-size:14px;opacity:.8}
.yearsel{appearance:none;background:#fff6d6;border:0;border-radius:999px;padding:8px 14px;font-weight:600;color:#3b2a14;min-height:44px}
.savebar{width:100%;font-size:13.5px;display:flex;align-items:center;gap:6px;opacity:.85}
.savebar::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,#23834f)}

main{padding:16px 0 120px}
.stack{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:0 1px 0 var(--line)}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.link{background:none;border:0;color:var(--brown);font-weight:600;padding:6px 0;cursor:pointer}

.banner{background:var(--sun-soft);border:1.5px dashed var(--sun);border-radius:16px;padding:12px 14px;display:grid;gap:10px;font-size:15px}
.banner .btns{display:flex;gap:8px;flex-wrap:wrap}

/* hero */
.hero{background:var(--surface);border-radius:20px;padding:18px}
.hero .lbl{color:var(--muted);font-size:15px}
.hero .big{font-family:var(--display);font-size:40px;line-height:1.1;margin:2px 0 12px}
.hero .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{border-radius:14px;padding:10px 12px}
.pill.in{background:var(--inc-soft)}.pill.out{background:var(--exp-soft)}
.pill .l{font-size:14px;color:var(--muted)}
.pill .v{font-family:var(--display);font-size:21px}
.pill.in .v{color:var(--inc)}.pill.out .v{color:var(--exp)}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qbtn{border:0;border-radius:18px;padding:18px 12px;font-family:var(--display);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:72px;color:#fff}
.qbtn.in{background:var(--inc)}.qbtn.out{background:var(--exp)}
:root[data-theme="dark"] .qbtn,:root:not([data-theme="light"]) .qbtn{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .qbtn{color:#18120a}}
:root[data-theme="dark"] .qbtn{color:#18120a}
.qbtn svg{flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:10px 16px;min-height:48px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--brown);border-color:var(--brown);color:var(--surface)}
.btn.danger{color:var(--exp);border-color:var(--exp-soft)}
.btn.block{width:100%}
a.btn{text-decoration:none}

/* list rows */
.day{font-size:14px;color:var(--muted);margin:14px 4px 6px;font-weight:600}
.rows{background:var(--surface);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px}
.ico.in{background:var(--inc-soft)}.ico.out{background:var(--exp-soft)}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .a{font-family:var(--display);font-size:18px;text-align:right}
.row .a.in{color:var(--inc)}.row .a.out{color:var(--exp)}
.flag{display:inline-block;font-size:12px;padding:0 8px;border-radius:999px;background:var(--exp-soft);color:var(--exp);margin-left:4px;font-weight:500}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:42px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;min-height:48px}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:14px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.bar .e{font-size:20px}
.bar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{grid-column:2/-1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;border-radius:5px;background:var(--c)}
.watch{display:grid;gap:12px}
.watch .item{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:start}
.watch .dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--sun-soft)}
.watch .dot.bad{background:var(--exp-soft)}
.progress{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 2px}
.progress div{height:100%;background:var(--c,var(--inc))}

/* tax */
.taxhero{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px}
.taxhero .big{font-family:var(--display);font-size:40px;line-height:1.1;margin:4px 0}
.taxhero .tip{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{border:2px solid var(--line);border-radius:16px;padding:12px}
.m.best{border-color:var(--inc);background:var(--inc-soft)}
.m .v{font-family:var(--display);font-size:24px}
.m .badge{display:inline-block;font-size:12.5px;background:var(--inc);color:var(--surface);border-radius:999px;padding:1px 8px;margin-top:4px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:15.5px}
.kv .tot{font-weight:600;border-top:1px solid var(--line);padding-top:8px}
details.card summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-size:18px;min-height:32px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"";width:10px;height:10px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);margin-right:4px;flex:none}
details[open].card summary::after{transform:rotate(-135deg)}
details.card[open] summary{margin-bottom:12px}
.field{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.field input{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;min-height:46px;width:100%;text-align:right}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.toggle input{appearance:none;width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;margin:0}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle input:checked{background:var(--inc)}
.toggle input:checked::after{left:25px}
@media (prefers-reduced-motion:no-preference){.toggle input::after{transition:left .15s}.sheet{transition:transform .2s ease-out}}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;font-size:13px}
.r{text-align:right}
.note{font-size:14.5px;color:var(--muted);line-height:1.6}
.note ul{margin:0;padding-left:20px}
.note li{margin-bottom:6px}
textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:10px;font-family:ui-monospace,monospace;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:28px 12px}

/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .col{display:grid;grid-template-columns:repeat(4,1fr);padding:0 4px}
nav.bottom a{display:grid;justify-items:center;gap:2px;padding:8px 0 10px;text-decoration:none;color:var(--muted);font-size:13.5px;font-weight:500}
nav.bottom a[aria-current="page"]{color:var(--brown)}
nav.bottom a[aria-current="page"] .nicon{background:var(--sun-soft)}
.nicon{width:52px;height:30px;border-radius:999px;display:grid;place-items:center}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:84px;z-index:6;border:0;border-radius:999px;background:var(--brown);color:var(--surface);font-family:var(--display);font-size:18px;padding:0 22px 0 16px;height:60px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(59,42,20,.3);cursor:pointer}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(30,20,8,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 0 calc(20px + env(safe-area-inset-bottom))}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet .col{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.sheet .hd{display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--surface);width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer;line-height:1}
.kind{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:16px;padding:4px;gap:4px}
.kind button{border:0;background:none;border-radius:12px;min-height:50px;font-family:var(--display);font-size:18px;cursor:pointer;color:var(--muted)}
.kind button.in[aria-pressed="true"]{background:var(--inc);color:var(--surface)}
.kind button.out[aria-pressed="true"]{background:var(--exp);color:var(--surface)}
.amtbox{background:var(--surface);border-radius:18px;padding:12px 16px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.amtbox label{font-size:15px;color:var(--muted)}
.amtline{display:flex;align-items:baseline;gap:8px}
.amtline input{flex:1;min-width:0;width:100%;border:0;background:none;font-family:var(--display);font-size:40px;line-height:1.2;padding:0;outline:none}
.amtline input:focus-visible{outline:none}
.amtbox:focus-within{box-shadow:0 0 0 3px var(--sun)}
.amtline span{font-size:18px;color:var(--muted)}
.plus{display:flex;gap:6px;flex-wrap:wrap}
.plus button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;min-height:40px;cursor:pointer;font-weight:500}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:360px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat{border:2px solid transparent;background:var(--surface);border-radius:16px;padding:10px 6px;display:grid;justify-items:center;gap:4px;cursor:pointer;font-size:14px;line-height:1.25;text-align:center;min-height:84px}
.cat .e{font-size:26px}
.cat[aria-pressed="true"]{border-color:var(--brown);background:var(--sun-soft)}
.sec-l{font-size:15px;color:var(--muted);margin-bottom:-6px}
.dates{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dates input{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:42px}
.txt{width:100%;border:0;background:var(--surface);border-radius:14px;padding:12px 14px;min-height:50px}
.evbox{background:var(--surface);border-radius:14px;padding:4px 14px}
.evbox .toggle{border-bottom:0}
.savebtns{display:grid;grid-template-columns:1fr;gap:8px}
.bigsave{border:0;border-radius:16px;min-height:58px;font-family:var(--display);font-size:20px;cursor:pointer;color:var(--surface)}
.bigsave.in{background:var(--inc)}.bigsave.out{background:var(--exp)}
.toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:16px;z-index:30;max-width:90%;text-align:center}
.savebar button{border:0;background:#fff6d6;color:#3b2a14;border-radius:999px;padding:4px 12px;min-height:32px;font-weight:600;cursor:pointer;margin-left:4px}
.dbstat{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 12px;font-size:15.5px}
.dbstat>:nth-child(2n){text-align:right;overflow-wrap:anywhere}
.items{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.item{background:var(--surface);border-radius:16px;padding:10px 12px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.item .r1{display:flex;gap:8px;align-items:center}
.item input{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;min-height:44px;width:100%;min-width:0}
.item .nums{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr) minmax(0,1.1fr);gap:8px}
.item .nums label{font-size:12.5px;color:var(--muted);display:grid;gap:2px}
.item .lt{display:flex;justify-content:space-between;font-size:14.5px;color:var(--muted)}
.item .lt strong{color:var(--ink);font-family:var(--display);font-weight:500}
.ix{border:0;background:var(--bg);width:44px;height:44px;border-radius:12px;flex:none;cursor:pointer;font-size:22px;line-height:1;color:var(--muted)}
.additem{border:1.5px dashed var(--brown);background:none;color:var(--brown);border-radius:14px;min-height:48px;font-weight:600;cursor:pointer}
.amtline input[readonly]{color:var(--ink)}
.autonote{font-size:13.5px;color:var(--muted)}
.itbl td,.itbl th{padding:8px 4px;vertical-align:top}
.itbl td small{display:block;color:var(--muted);font-size:12.5px}
.itbl .nm{font-weight:500}
.evgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.evgrid:empty{display:none}
.evth{position:relative;background:var(--surface);border-radius:12px;overflow:hidden;display:grid}
.evimg{border:0;padding:0;background:var(--line);aspect-ratio:3/4;cursor:zoom-in;display:block;width:100%}
.evimg img{width:100%;height:100%;object-fit:cover;display:block}
.evno{font-size:12px;padding:4px 6px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.evx{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px;cursor:pointer;line-height:1}
.evth.busy{aspect-ratio:3/4;place-items:center;font-size:13px;color:var(--muted);text-align:center;padding:8px}
.evbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.evbtns .btn{font-size:15.5px;padding:10px 8px}
.viewer{position:fixed;inset:0;background:rgba(10,8,4,.94);z-index:40;display:grid;grid-template-rows:auto minmax(0,1fr)}
.viewer .vbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;color:#fff;font-family:var(--display)}
.viewer .vbody{display:grid;place-items:center;min-height:0;padding:0 8px 12px}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.viewer .vload{color:#fff}
.clip{font-size:12.5px;margin-left:6px;color:var(--muted);font-weight:500}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetRoot"></div>
<script id="app-script">
(function(){
"use strict";
const LS_KEY = 'kluaytak-khunya-state';

const CATS = {
  in: [['retail','ขายหน้าร้าน','🏪'],['wholesale','ขายส่งร้านค้า','📦'],['online','ขายออนไลน์','📱'],['consign','ฝากขาย / ออกบูธ','🎪'],['other_in','รายรับอื่น','💰']],
  out: [['banana','กล้วยน้ำว้าสด','🍌'],['ingredient','น้ำผึ้ง / ส่วนผสม','🍯'],['package','ถุง / ฉลาก','🛍️'],['labor','ค่าแรง','👩‍🌾'],['utility','ไฟ / น้ำ / แก๊ส','🔥'],['shipping','ขนส่ง / น้ำมัน','🚚'],['equipment','อุปกรณ์ / ซ่อม','🔧'],['marketing','โฆษณา / ค่าแพลตฟอร์ม','📣'],['license','ค่าธรรมเนียม / ใบอนุญาต','📄'],['other_out','รายจ่ายอื่น','🧾']]
};
const CAT = {}; [...CATS.in, ...CATS.out].forEach(([k,n,e])=>CAT[k]={n,e});
const MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const MONTHS_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const BRACKETS = [[150000,0],[300000,.05],[500000,.10],[750000,.15],[1000000,.20],[2000000,.25],[5000000,.30],[Infinity,.35]];
const DEFAULT_TAX = {salary:0, spouse:false, kids:0, parents:0, sso:0, life:0, health:0, parentHealth:0, home:0, other:0, donation:0, wht:0, pnd94:0, evOnly:true};

/* ---------- state ---------- */
function loadLocal(){ try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; } }

    txns.push({d:d(25), t:'out', c:'utility', desc:'ค่าไฟโรงอบ + แก๊ส', amt:rnd(1500,2200), ev:true});

function emptyPend(){ return {up:[], del:[], tax:[], wipe:false}; }
function freshState(){ return {v:2, sample:false, savedAt:0, txns:[], tax:{}, pend:emptyPend()}; }
function uid(){
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
  const b = new Uint8Array(16); crypto.getRandomValues(b); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128;
  const h = [...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function cleanFiles(arr){
  return (Array.isArray(arr) ? arr : []).filter(f=>f && UUID_RE.test(String(f.id)) && +f.no>0 && +f.y>0)
    .map(f=>f.pending ? {id:f.id, y:+f.y, no:+f.no, pending:true} : {id:f.id, y:+f.y, no:+f.no});
}
function cleanItems(arr){
  return (Array.isArray(arr) ? arr : []).filter(i=>i && String(i.n||'').trim() && +i.q>0 && +i.p>=0)
    .map(i=>({n:String(i.n).trim().slice(0,100), q:Math.round(+i.q*1000)/1000, u:String(i.u||'').trim().slice(0,20), p:Math.round(+i.p*100)/100}));
}
function normalize(s){
  s.txns = Array.isArray(s.txns) ? s.txns : []; s.tax = s.tax || {};
  const p = s.pend || emptyPend(); s.pend = {up:p.up||[], del:p.del||[], tax:p.tax||[], wipe:!!p.wipe};
  s.txns.forEach(t=>{ if (!UUID_RE.test(String(t.id||''))){ const old=t.id; t.id=uid(); const i=s.pend.up.indexOf(old); if (i>=0) s.pend.up[i]=t.id; } t.amt=+t.amt; t.items=cleanItems(t.items); t.files=cleanFiles(t.files); });
  return s;
}

   - inside Claude: the viewer's Supabase connector runs "select public.app_*(...)"

function pendCount(){ const p = state.pend; return p.up.length + p.del.length + p.tax.length + (p.wipe?1:0); }
function markDirty(ch){
  state.savedAt = Date.now();
  ch = ch || {};
  if (ch.wipe) state.pend = {up:[], del:[], tax:[], wipe:true};
  const p = state.pend;
  if (ch.up && !p.up.includes(ch.up)) p.up.push(ch.up);
  if (ch.del){ p.up = p.up.filter(x=>x!==ch.del); if (!p.del.includes(ch.del)) p.del.push(ch.del); }
  if (ch.tax!=null && !p.tax.includes(+ch.tax)) p.tax.push(+ch.tax);
  if (ch.all){
    state.txns.forEach(t=>{ if (!p.up.includes(t.id)) p.up.push(t.id); });
    Object.keys(state.tax).forEach(y=>{ if (!p.tax.includes(+y)) p.tax.push(+y); });
  }
  storeLocal();
  if (state.sample) return;
  if (!conn){ ui.save = capChecked ? 'local' : ui.save; updateSave(); return; }
  if (ui.save !== 'error') ui.save = 'dirty';
  updateSave(); scheduleSave();
}
function scheduleSave(){ if (!conn || state.sample || !pendCount()) return; clearTimeout(saveTimer); saveTimer = setTimeout(()=>flush(false), 1500); }
function busy(){
  if (ui.sheet) return true;

  return !!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type!=='checkbox');
}
function txRow(t){ return {id:t.id, d:t.d, t:t.t, c:t.c, desc:(t.desc||'').slice(0,200), amt:Math.round(t.amt*100)/100, ev:!!t.ev, items:cleanItems(t.items)}; }
function buildPush(p){
  const ups = p.up.map(id=>state.txns.find(t=>t.id===id)).filter(Boolean).map(txRow);
  const tax = p.tax.map(y=>{ const s = taxSet(y); return {y:+y, salary:+s.salary||0, spouse:!!s.spouse, kids:Math.floor(+s.kids||0), parents:Math.floor(+s.parents||0), sso:+s.sso||0, life:+s.life||0, health:+s.health||0,
    parentHealth:+s.parentHealth||0, home:+s.home||0, other:+s.other||0, donation:+s.donation||0, wht:+s.wht||0, pnd94:+s.pnd94||0, evOnly:s.evOnly!==false}; });
  const empty = !p.wipe && !p.del.length && !ups.length && !tax.length;
  return {payload: empty ? null : {wipe:!!p.wipe, del:p.del, ups, tax}, sent:Object.fromEntries(ups.map(r=>[r.id, JSON.stringify(r)]))};
}
function normalizePull(d){

}
/* -- transport 1: Supabase connector inside Claude (SQL text; values travel as dollar-quoted literals) -- */
function dq(s){ s = String(s); let tag; do { tag = 'kt'+Math.random().toString(36).slice(2,8); } while (s.includes('$'+tag+'$')); return '$'+tag+'$'+s+'$'+tag+'$'; }
function lit(v){ return dq(JSON.stringify(v))+'::jsonb'; }
function b64utf8(b){ const bin = atob(b), bytes = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function makeConnectorApi(m){
  const run = q => m.callTool(SB.server, SB.tool, {project_id:SB.project, query:q}, {cache:false});
  const get = async expr => {
    const txt = sqlText(await run("select translate(encode(convert_to(coalesce(to_json("+expr+")::text,'null'),'UTF8'),'base64'),E'\\n','') as b64;"));
    const mm = txt.match(/"b64"\s*:\s*"([A-Za-z0-9+\/=]*)"/); if (!mm) throw {code:'parse_error'};
    return JSON.parse(b64utf8(mm[1]));
  };
  const id = v => { if (!UUID_RE.test(String(v))) throw {code:'bad_request'}; return "'"+v+"'::uuid"; };
  return { kind:'connector',
    pull: ()=>get('public.app_pull()'),
    push: p=>run('select public.app_push('+lit(p)+');'),
    reserve: y=>get('public.app_reserve_evidence_no('+(+y|0)+')'),
    addEv: (txn, ev)=>run('select public.app_add_evidence('+lit(txn)+','+lit(ev)+');'),
    delEv: e=>run('select public.app_delete_evidence('+id(e)+');'),
    thumbs: t=>get('public.app_evidence_thumbs('+id(t)+')'),
    image: e=>get('public.app_evidence_image('+id(e)+')'),
    whoami: ()=>get('public.app_whoami()'),
    members: ()=>get('public.app_members_list()'),
    memberAdd: e=>run('select public.app_member_add('+dq(e)+');'),
    memberRemove: e=>run('select public.app_member_remove('+dq(e)+');') };
}
/* -- transport 2: supabase-js with e-mail sign-in (standalone web page) -- */
function mapErr(e){
  const msg = String((e && (e.message || e.details)) || '');
  if (/not_member/.test(msg)) return {code:'not_member'};
  if (/not_owner/.test(msg)) return {code:'not_owner'};
  if (/bad_email/.test(msg)) return {code:'bad_email'};
  if ((e && e.code==='PGRST301') || /jwt|JWT|not authenticated/i.test(msg)) return {code:'signed_out'};
  if (/Failed to fetch|NetworkError|network|Load failed/i.test(msg)) return {code:'server_unavailable'};
  return {code:'tool_error', message:msg};
}
function makeDirectApi(c){
  const call = async (fn, args) => { let r; try { r = await c.rpc(fn, args||{}); } catch(e){ throw mapErr(e); } if (r.error) throw mapErr(r.error); return r.data; };
  return { kind:'direct',
    pull: ()=>call('app_pull'), push: p=>call('app_push',{p}), reserve: y=>call('app_reserve_evidence_no',{y}),
    addEv: (txn, ev)=>call('app_add_evidence',{txn, ev}), delEv: eid=>call('app_delete_evidence',{eid}),
    thumbs: txn=>call('app_evidence_thumbs',{txn}), image: eid=>call('app_evidence_image',{eid}),
    whoami: ()=>call('app_whoami'), members: ()=>call('app_members_list'),
    memberAdd: e=>call('app_member_add',{member_email:e}), memberRemove: e=>call('app_member_remove',{member_email:e}) };
}
async function flush(force){
  if (!conn || syncing || state.sample || !pendCount()) return true;
  if (!force && busy()){ scheduleSave(); return false; }
  syncing = true; ui.save = 'saving'; updateSave();
  const snap = JSON.parse(JSON.stringify(state.pend));
  const {payload, sent} = buildPush(snap);
  let ok = false;
  try {
    if (payload) await conn.push(payload);
    const p = state.pend;
    if (snap.wipe) p.wipe = false;
    p.del = p.del.filter(x=>!snap.del.includes(x));
    p.tax = p.tax.filter(x=>!snap.tax.includes(x));
    p.up = p.up.filter(id=>{ if (!snap.up.includes(id)) return true; const t = state.txns.find(x=>x.id===id); return !!(t && sent[id] && JSON.stringify(txRow(t))!==sent[id]); });
    storeLocal(); lastErr = null; lastSync = Date.now(); ok = true;
    ui.save = pendCount() ? 'dirty' : 'saved';
  } catch(e){ lastErr = e || {code:'upstream_error'}; ui.save = 'error'; handleAuthErr(e); }
  syncing = false; updateSave();
  if (ok && pendCount()) scheduleSave();
  return ok;
}
async function syncNow(initial){
  if (!conn || syncing) return;
  clearTimeout(saveTimer);
  if (!state.sample && pendCount()){ const ok = await flush(true); if (!ok) return; }
  syncing = true; ui.save = 'saving'; updateSave();
  try {
    const db = normalizePull(await conn.pull());
    syncing = false;
    if (db.txns.length || Object.keys(db.tax).length){
      state.txns = db.txns; state.tax = db.tax; state.sample = false; state.pend = emptyPend();
      lastSync = Date.now(); ui.save = 'saved';
      if (!years().includes(+ui.year)) ui.year = pickDefaultYear();
    } else if (!state.sample && state.txns.length && initial){
      markDirty({all:true}); await flush(true);   // first run: move this device's data into Supabase
    } else { lastSync = Date.now(); ui.save = 'saved'; }
    mergeEvPending(); storeLocal(); render(); uploadEvidence();
  } catch(e){ syncing = false; lastErr = e || {code:'upstream_error'}; ui.save = 'error'; updateSave(); handleAuthErr(e); }
}
function handleAuthErr(e){
  if (mode!=='web' || !e) return;
  if (e.code==='not_member'){ conn = null; ui.auth = {step:'denied', email: me && me.email}; render(); }
  if (e.code==='signed_out'){ conn = null; ui.auth = {step:'email'}; render(); }
}
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='hidden' && pendCount() && conn){ clearTimeout(saveTimer); flush(true); }});
function loadScript(src){ return new Promise((res, rej)=>{ const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function startConnector(m){
  conn = makeConnectorApi(m); mode = 'claude'; capChecked = true;
  syncNow(true);
  try { me = await conn.whoami(); } catch(e){ me = {role:'owner'}; }
}
async function initDirect(){
  mode = 'web';
  try { await loadScript(SB.lib); } catch(e){ capChecked = true; ui.save = 'local'; lastErr = {code:'server_unavailable'}; render(); return; }
  sbClient = window.supabase.createClient(SB.url, SB.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'implicit'}});
  sbClient.auth.onAuthStateChange((ev, session)=>{
    if (session && (ev==='SIGNED_IN' || ev==='INITIAL_SESSION')) setTimeout(()=>onSignedIn(session), 0);
    if (ev==='SIGNED_OUT'){ conn = null; me = null; ui.auth = {step:'email'}; ui.save = 'local'; render(); }
  });
  let session = null;
  try { session = (await sbClient.auth.getSession()).data.session; } catch(e){}
  capChecked = true;
  if (session) onSignedIn(session); else { ui.auth = ui.auth || {step:'email'}; ui.save = 'local'; render(); }
}
async function onSignedIn(session){
  if (conn || signingIn) return;
  signingIn = true; ui.auth = {step:'checking'}; render();
  const api = makeDirectApi(sbClient);
  try { me = await api.whoami(); } catch(e){ me = null; }
  signingIn = false;
  if (!me || !me.role){ ui.auth = {step:'denied', email:(session.user && session.user.email) || (me && me.email)}; ui.save = 'local'; render(); return; }
  if (/access_token=/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
  conn = api; ui.auth = null; ui.skipLogin = false; render(); syncNow(true);
}
(function initCap(tries){
  if (window.claude && typeof window.claude.use === 'function'){
    mode = 'claude';
    window.claude.use('mcp').then(m=>{ capChecked = true;
      if (!m){ ui.save = 'local'; updateSave(); return; }
      startConnector(m);
    }).catch(()=>{ capChecked = true; ui.save = 'local'; updateSave(); });
  } else if (tries < 6){ setTimeout(()=>initCap(tries+1), 250); }
  else initDirect();
})(0);

/* ---------- evidence photos (receipts / transfer slips) ---------- */
/* Each photo gets a running number per year from public.evidence_counters, is stamped with it
   as a watermark in the browser, then stored (image + thumbnail) in public.evidence. */
const LS_EV = 'kluaytak-khunya-evidence-pending';
const thumbCache = new Map();
let evOps = (function(){ try { const a = JSON.parse(localStorage.getItem(LS_EV)||'[]'); return Array.isArray(a) ? a : []; } catch(e){ return []; } })();
let evUploading = false, evMemOnly = false;
evOps.forEach(o=>{ if (o.op==='add' && o.thumb) thumbCache.set(o.id, 'data:image/jpeg;base64,'+o.thumb); });
function storeEvOps(){ try { localStorage.setItem(LS_EV, JSON.stringify(evOps)); evMemOnly = false; } catch(e){ evMemOnly = true; } }
const B64_RE = /^[A-Za-z0-9+\/=]+$/;
const evCode = f => be(f.y)+'-'+String(f.no).padStart(4,'0');
function sqlText(res){
  let txt = res && res.payload;
  if (txt && typeof txt === 'object' && typeof txt.result === 'string') txt = txt.result;
  if (typeof txt !== 'string') txt = ((res && res.content) || []).map(c=>c.text||'').join('\n');
  return String(txt).replace(/\\"/g,'"');
}
async function reserveEvNo(y){
  const n = +(await conn.reserve(y));
  if (!(n > 0)) throw {code:'parse_error'};
  return n;
}
function loadImage(file){
  return new Promise((res, rej)=>{ const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); res(img); }; img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('image')); }; img.src = url; });
}
function fitFont(g, text, weight, size, maxW, fam){ let s = size; g.font = weight+' '+s+'px '+fam; while (g.measureText(text).width > maxW && s > 10){ s -= 2; g.font = weight+' '+s+'px '+fam; } return s; }
function thaiDate(d){ const [y,m,dd] = d.split('-').map(Number); return dd+' '+MONTHS[m-1]+' '+be(y); }
async function stampImage(file, code, kind, d){
  const img = await loadImage(file);
  try { await document.fonts.load('600 40px "IBM Plex Sans Thai"'); } catch(e){}
  const FAM = '"IBM Plex Sans Thai","Mitr",sans-serif';
  let scale = Math.min(1, 1600/Math.max(img.naturalWidth, img.naturalHeight));
  for (let attempt=0; attempt<4; attempt++){
    const W = Math.max(1, Math.round(img.naturalWidth*scale)), H = Math.max(1, Math.round(img.naturalHeight*scale));
    const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0,0,W,H); g.drawImage(img, 0, 0, W, H);
    const u = Math.max(W,H)/100;
    // faint diagonal repeat so the slip cannot be reused without the number showing
    g.save(); g.translate(W/2, H/2); g.rotate(-Math.PI/6); g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '600 '+Math.round(u*3.6)+'px '+FAM; g.lineWidth = Math.max(1, u*.12);
    const span = Math.hypot(W,H), mark = 'หลักฐาน '+code;
    for (let row=0, y=-span/2; y<=span/2; y+=u*14, row++) for (let x=-span/2 + (row%2)*u*22; x<=span/2; x+=u*44){
      g.strokeStyle = 'rgba(0,0,0,.16)'; g.strokeText(mark, x, y); g.fillStyle = 'rgba(255,255,255,.24)'; g.fillText(mark, x, y);
    }
    g.restore();
    // bottom band with the evidence number
    const bh = Math.max(70, Math.round(u*12)), pad = Math.round(u*3);
    g.fillStyle = 'rgba(30,20,8,.78)'; g.fillRect(0, H-bh, W, bh);
    g.fillStyle = '#f5b301'; g.fillRect(0, H-bh, Math.max(6, Math.round(u)), bh);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.fillStyle = '#fff';
    const l1 = 'หลักฐานลำดับที่ '+code, l2 = 'กล้วยตากคุณย่า · '+(kind==='in'?'รายรับ':'รายจ่าย')+' วันที่ '+thaiDate(d)+' · แนบเมื่อ '+thaiDate(TODAY)+' '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
    fitFont(g, l1, '600', Math.round(bh*.38), W-pad*2, FAM); g.fillText(l1, pad, H-bh*.46);
    fitFont(g, l2, '400', Math.round(bh*.2), W-pad*2, FAM); g.fillStyle = 'rgba(255,255,255,.88)'; g.fillText(l2, pad, H-bh*.15);
    let q = .82, b64 = c.toDataURL('image/jpeg', q).split(',')[1];
    while (b64.length > 650000 && q > .5){ q -= .1; b64 = c.toDataURL('image/jpeg', q).split(',')[1]; }
    if (b64.length > 650000){ scale *= .75; continue; }
    const ts = Math.min(1, 320/Math.max(W,H)), tc = document.createElement('canvas');
    tc.width = Math.max(1, Math.round(W*ts)); tc.height = Math.max(1, Math.round(H*ts)); tc.getContext('2d').drawImage(c, 0, 0, tc.width, tc.height);
    return {b64, thumb:tc.toDataURL('image/jpeg', .7).split(',')[1], w:W, h:H, size:Math.floor(b64.length*3/4)};
  }
  throw new Error('too_big');
}
function evPendingCount(){ return evOps.length; }
function mergeEvPending(){
  evOps.forEach(o=>{
    const t = state.txns.find(x=>x.id===o.txn); if (!t) return;
    t.files = t.files || [];

async function uploadEvidence(){

/* ---------- tax engine ---------- */
function progressive(n){
  let tax=0, prev=0; const steps=[];
  for (const [cap,r] of BRACKETS){ if (n>prev){ const part=Math.min(n,cap)-prev, t=part*r; steps.push({from:prev,to:cap,r,part,t}); tax+=t; } prev=cap; }
  return {tax, steps};
}
function calcTax(y, method){
  const tx = txYear(y), s = taxSet(y);
  const gross = sum(tx.filter(t=>t.t==='in'), t=>t.amt);
  const expAll = sum(tx.filter(t=>t.t==='out'), t=>t.amt);
  const expEv = sum(tx.filter(t=>t.t==='out' && t.ev), t=>t.amt);
  const bizExp = method==='flat' ? gross*0.6 : (s.evOnly ? expEv : expAll);
  const bizNet = Math.max(0, gross - bizExp);
  const salary = +s.salary||0, salDed = Math.min(salary*0.5, 100000);
  const netIncome = bizNet + salary - salDed;
  const life = Math.min(+s.life||0, 100000), health = Math.min(+s.health||0, 25000, 100000-life);
  const allowTotal = 60000 + (s.spouse?60000:0) + (+s.kids||0)*30000 + Math.min(+s.parents||0,4)*30000 + (+s.sso||0) + life + health +
    Math.min(+s.parentHealth||0,15000) + Math.min(+s.home||0,100000) + (+s.other||0);
  const afterAllow = Math.max(0, netIncome - allowTotal);
  const donation = Math.min(+s.donation||0, afterAllow*0.10);
  const taxable = Math.max(0, afterAllow - donation);
  const prog = progressive(taxable);
  let minTax = 0, usedMin = false;
  if (gross >= 120000){ minTax = gross*0.005; if (minTax > 5000 && minTax > prog.tax) usedMin = true; }
  const tax = usedMin ? minTax : prog.tax;
  const credits = (+s.wht||0) + (+s.pnd94||0);
  return {method, gross, expAll, expEv, bizExp, bizNet, salary, salDed, netIncome, allowTotal, afterAllow, donation, taxable, prog, minTax, usedMin, tax, credits, due: tax-credits};
}
function calcHalf(y, method){
  const tx = txYear(y).filter(t=>+t.d.slice(5,7)<=6), s = taxSet(y);
  const gross = sum(tx.filter(t=>t.t==='in'), t=>t.amt);
  const exp = method==='flat' ? gross*0.6 : sum(tx.filter(t=>t.t==='out' && (t.ev || !s.evOnly)), t=>t.amt);
  const net = Math.max(0, gross-exp);
  const allow = 30000 + (s.spouse?30000:0) + (+s.kids||0)*15000;
  const taxable = Math.max(0, net-allow);
  let tax = progressive(taxable).tax;
  if (gross >= 60000){ const m = gross*0.005; if (m>5000 && m>tax) tax = m; }
  return {gross, exp, net, allow, taxable, tax};
}
function bestTax(y){ const a = calcTax(y,'flat'), b = calcTax(y,'actual'); return b.tax < a.tax ? b : a; }

function niceMax(v){ if (v<=0) return 1000; const p = Math.pow(10, Math.floor(Math.log10(v))), n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function shortBaht(v){ return v>=1e6 ? (v/1e6).toLocaleString('th-TH',{maximumFractionDigits:1})+' ล.' : v>=1000 ? (v/1000).toLocaleString('th-TH',{maximumFractionDigits:1})+'k' : String(v); }
function monthlyChart(tx){
  const inc = Array(12).fill(0), exp = Array(12).fill(0);
  tx.forEach(t=>{ const m=+t.d.slice(5,7)-1; (t.t==='in'?inc:exp)[m]+=t.amt; });
  const W=520,H=230,L=40,R=4,T=10,B=26, max = niceMax(Math.max(...inc,...exp));
  const cw=(W-L-R)/12, bw=Math.min(14,cw*0.36), yv = v => T + (H-T-B)*(1-v/max);
  let g='';
  for (let i=0;i<=4;i++){ const v=max*i/4, yy=yv(v); g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="12" fill="var(--muted)">'+shortBaht(v)+'</text>'; }
  for (let m=0;m<12;m++){
    const cx = L+cw*m+cw/2;
    g += '<rect x="'+(cx-bw-1)+'" y="'+yv(inc[m])+'" width="'+bw+'" height="'+(H-B-yv(inc[m]))+'" rx="3" fill="var(--inc)"><title>'+MONTHS[m]+' รับ '+baht(inc[m])+'</title></rect>';
    g += '<rect x="'+(cx+1)+'" y="'+yv(exp[m])+'" width="'+bw+'" height="'+(H-B-yv(exp[m]))+'" rx="3" fill="var(--exp)"><title>'+MONTHS[m]+' จ่าย '+baht(exp[m])+'</title></rect>';
    g += '<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle" font-size="11.5" fill="var(--muted)">'+MONTHS[m].replace(/\./g,'')+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="กราฟรายรับและรายจ่ายรายเดือน">'+g+'</svg>';
}
function catBars(tx, kind, color){

function itemTable(tx, kind){

function toCsv(list){
  const q = v => '"'+String(v).replace(/"/g,'""')+'"';

}
function toItemsCsv(list){
  const q = v => '"'+String(v).replace(/"/g,'""')+'"';
  const out = [['วันที่','ประเภท','หมวด','สินค้า','จำนวน','หน่วย','ราคาต่อหน่วย','รวม','รายละเอียด'].map(q).join(',')];
  list.slice().sort((a,b)=>a.d.localeCompare(b.d)).forEach(t=>(t.items||[]).forEach(i=>out.push([t.d, t.t==='in'?'รายรับ':'รายจ่าย', CAT[t.c]?CAT[t.c].n:t.c, i.n, i.q, i.u, i.p, Math.round(i.q*i.p*100)/100, t.desc].map(q).join(','))));
  return out.join('\n');
}
async function copyOut(text, label){

              : '<button type="button" class="btn block" data-act="saveMore">บันทึก แล้วเพิ่มรายการต่อ</button>') + '</div>' +
    '</div></div>';
  if (focusAmt && !s.editId){ const i = document.getElementById('shAmt'); if (i) i.focus(); }
}
function fmtAmt(v){ const n = parseFloat(String(v).replace(/,/g,'')); if (!isFinite(n)) return ''; const [i,d] = String(v).replace(/,/g,'').split('.'); return Number(i||0).toLocaleString('en-US') + (d!==undefined?'.'+d.slice(0,2):''); }
function saveEntry(more){
  const s = ui.sheet;
  const items = [];
  const amt = Math.round(numOf(s.amt)*100)/100;
  if (!(amt>0)){ toast('ใส่จำนวนเงินก่อนนะ'); const i = document.getElementById('shAmt'); if (i) i.focus(); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s.d)){ toast('เลือกวันที่ก่อนนะ'); return; }
  if (s.evBusy){ toast('รอใส่เลขหลักฐานในรูปให้เสร็จก่อนนะ'); return; }
  const newEv = s.newEv.slice(), delEv = s.delEv.slice();
  const files = s.files.filter(f=>!delEv.includes(f.id)).concat(newEv.map(f=>({id:f.id, y:f.y, no:f.no, pending:true})));
  const rec = {d:s.d, t:s.kind, c:s.c, desc:s.desc.trim(), amt, ev:s.ev, items, files};
  if (s.editId){ Object.assign(state.txns.find(t=>t.id===s.editId), rec); rec.id = s.editId; toast('แก้ไขแล้ว'); }
  else { rec.id = uid(); state.txns.push(rec); toast('บันทึก'+(rec.t==='in'?'รายรับ':'รายจ่าย')+' '+baht(amt, amt%1!==0)+' บาท แล้ว'); }
  const changedId = rec.id;
  if (+s.d.slice(0,4)!==+ui.year) ui.year = +s.d.slice(0,4);
  if (more){ ui.sheet = Object.assign({}, s, {editId:null, amt:'', desc:'', confirmDel:false, items:[blankItem()], files:[], newEv:[], delEv:[], evBusy:0}); render(); renderSheet(true); }
  else { closeSheet(); render(); }
  markDirty({up:changedId});
  if (newEv.length || delEv.length) queueEvidence(changedId, newEv, delEv);
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const b = e.target.closest('button,[data-act]'); if (!b) return;
  const d = b.dataset;
  if (d.open){ openSheet(d.open); return; }
  if (d.edit){ openSheet(null, d.edit); return; }
  if (d.skind){ ui.sheet.kind = d.skind; ui.sheet.c = CATS[d.skind][0][0]; renderSheet(); return; }
  if (d.cat){ ui.sheet.c = d.cat; renderSheet(); return; }
  if (d.act==='evCam' || d.act==='evPick'){ const inp = document.getElementById(d.act); if (inp) inp.click(); return; }
  if (d.evview){ openViewer(d.evview); return; }
  if (d.act==='closeViewer'){ closeViewer(); return; }
  if (d.memdel && conn){ const em = d.memdel; ui.membersErr = ''; conn.memberRemove(em).then(()=>{ toast('เอา '+em+' ออกแล้ว'); loadMembers(); }).catch(e=>{ ui.membersErr = errText(e); render(); }); return; }
  if (d.act==='memAdd' && conn){ const inp = document.getElementById('memEmail'), em = (inp && inp.value || '').trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ ui.membersErr = 'ใส่อีเมลให้ถูกต้องก่อนนะ'; render(); return; }
    conn.memberAdd(em).then(()=>{ ui.membersErr = ''; toast('เพิ่ม '+em+' แล้ว'); loadMembers(); }).catch(e=>{ ui.membersErr = errText(e); render(); }); return; }
  if (d.act==='sendLink'){ sendLink(); return; }
  if (d.act==='verifyCode'){ verifyCode(); return; }
  if (d.act==='loginAgain'){ ui.auth = {step:'email', email:(ui.auth||{}).email}; render(); return; }
  if (d.act==='skipLogin'){ ui.skipLogin = true; render(); return; }
  if (d.act==='showLogin'){ ui.skipLogin = false; ui.auth = ui.auth || {step:'email'}; render(); return; }
  if (d.act==='logout'){ (sbClient ? sbClient.auth.signOut().catch(()=>{}) : Promise.resolve()).then(()=>{ conn = null; me = null; ui.members = null; ui.auth = {step:'email'}; ui.skipLogin = false; ui.save = 'local'; render(); }); return; }
  if (d.act==='recheck' && sbClient){ sbClient.auth.getSession().then(r=>{ const s = r.data && r.data.session; if (s) onSignedIn(s); else { ui.auth = {step:'email'}; render(); } }); return; }
  if (d.evdel && ui.sheet){ const s = ui.sheet, id = d.evdel;
    if (s.newEv.some(f=>f.id===id)) s.newEv = s.newEv.filter(f=>f.id!==id); else if (!s.delEv.includes(id)) s.delEv.push(id);
    renderEvBox(); toast('เอารูปออกแล้ว กดบันทึกเพื่อยืนยัน'); return; }
  if (d.delitem!==undefined){ const s = ui.sheet; s.items.splice(+d.delitem, 1); if (!s.items.length) s.items.push(blankItem()); if (!sheetItemsActive(s)) s.amt=''; renderSheet(); return; }
  if (d.act==='addItem'){ ui.sheet.items.push(blankItem()); renderSheet(ui.sheet.items.length-1); return; }
  if (d.act==='copyItemsCsv'){ copyOut(toItemsCsv(txYear(ui.year)), 'รายการสินค้า'); return; }
  if (d.day){ ui.sheet.d = d.day; renderSheet(); return; }
  if (d.plus!==undefined){ const cur = parseFloat(String(ui.sheet.amt).replace(/,/g,''))||0; ui.sheet.amt = d.plus==='0' ? '' : String(cur + +d.plus); renderSheet(); return; }
  if (d.fm!==undefined){ ui.fMonth = d.fm; render(); return; }
  if (d.ft!==undefined){ ui.fType = d.ft; render(); return; }
  const act = d.act;
  if (act==='closeSheet') closeSheet();
  if (act==='saveEntry') saveEntry(false);
  if (act==='saveMore') saveEntry(true);
  if (act==='delAsk'){ ui.sheet.confirmDel = true; renderSheet(); }
  if (act==='syncNow'){ syncNow(false); }
  if (act==='delYes'){ const id = ui.sheet.editId; state.txns = state.txns.filter(t=>t.id!==id); evOps = evOps.filter(o=>o.txn!==id); storeEvOps(); closeSheet(); render(); markDirty({del:id}); toast('ลบรายการแล้ว'); }
  if (act==='clearSample'){ state = freshState(); ui.year = now.getFullYear(); render(); markDirty(); toast('ล้างแล้ว เริ่มบันทึกได้เลย'); }
  if (act==='keepSample'){ state.sample=false; render(); markDirty({all:true}); }
  if (act==='copyCsv') copyOut(toCsv(txYear(ui.year)), 'รายการ');
  if (act==='copyCsvAll') copyOut(toCsv(state.txns), 'รายการ');
  if (act==='copyJson') copyOut(JSON.stringify(state), 'ข้อมูลสำรอง');
  if (act==='importJson'){
    try { const s = JSON.parse(document.getElementById('inBox').value); if (!s || !Array.isArray(s.txns)) throw 0;
      s.txns = s.txns.filter(t=>t && /^\d{4}-\d{2}-\d{2}$/.test(t.d) && (t.t==='in'||t.t==='out') && CAT[t.c] && +t.amt>0);
      s.txns.forEach(t=>{ t.files = []; }); evOps = []; storeEvOps();
      s.pend = emptyPend(); s.sample=false; state=normalize(s); ui.year=pickDefaultYear(); render(); markDirty({wipe:true, all:true}); toast('กู้คืน '+s.txns.length+' รายการแล้ว');
    } catch(err){ toast('ข้อมูลไม่ถูกต้อง ต้องเป็นข้อความจากปุ่ม "คัดลอกข้อมูลสำรอง"'); }
  }
  if (act==='wipe'){ ui.confirmWipe=true; render(); }
  if (act==='wipeNo'){ ui.confirmWipe=false; render(); }
  if (act==='wipeYes'){ checkPin(document.getElementById('wipePin')).then(ok=>{
    if (!ok){ const m=document.getElementById('wipeMsg'), i=document.getElementById('wipePin'); if (m) m.textContent='PIN ไม่ถูกต้อง ยังไม่ได้ลบข้อมูล'; if (i){ i.value=''; i.focus(); } return; }
    state=freshState(); evOps=[]; storeEvOps(); ui.confirmWipe=false; render(); markDirty({wipe:true}); toast('ลบข้อมูลทั้งหมดแล้ว'); }); }
});
document.addEventListener('input', e=>{
  const el = e.target;
  if (el.id==='shAmt'){ const raw = el.value.replace(/[^\d.]/g,'').replace(/(\..*)\./g,'$1'); ui.sheet.amt = raw; const f = fmtAmt(raw); if (f!==el.value){ el.value = f; el.setSelectionRange(f.length,f.length); } return; }
  if (el.id==='shDesc'){ ui.sheet.desc = el.value; return; }
  if (el.dataset.item!==undefined && ui.sheet){
    const it = ui.sheet.items[+el.dataset.item]; if (!it) return; const f = el.dataset.f;
    if (f==='q' || f==='p'){ const raw = el.value.replace(/[^\d.]/g,'').replace(/(\..*)\./g,'$1'); if (raw!==el.value) el.value = raw; it[f] = raw; }
    else it[f] = el.value;
    refreshTotals(); return;
  }
  if (el.id==='shDate'){ if (el.value){ ui.sheet.d = el.value; renderSheet(); } return; }
  if (el.id==='fText'){ ui.fText = el.value; const pos = el.selectionStart; render(); const n=document.getElementById('fText'); n.focus(); n.setSelectionRange(pos,pos); return; }
  if (el.dataset.tax){ const v = Math.max(0, parseFloat(el.value.replace(/,/g,''))||0); setTax(el.dataset.tax, v, true); }
});
document.addEventListener('change', e=>{
  const el = e.target;
  if (el.id==='yearSel'){ ui.year = +el.value; ui.fMonth='all'; render(); return; }
  if (el.id==='shEv'){ ui.sheet.ev = el.checked; return; }
  if ((el.id==='evCam' || el.id==='evPick') && el.files && el.files.length){ const fl = [...el.files]; el.value = ''; addEvidenceFiles(fl); return; }
  if (el.dataset.item!==undefined && el.dataset.f==='n' && ui.sheet){
    // known item: fill unit and last price used, if still empty
    const idx = +el.dataset.item, it = ui.sheet.items[idx], mem = itemMemory(ui.sheet.kind).get(String(el.value).trim()); if (!it || !mem) return;
    const set = (f,v) => { if (v==null || String(it[f]).trim()!=='') return; it[f] = String(v); const inp = document.querySelector('[data-item="'+idx+'"][data-f="'+f+'"]'); if (inp) inp.value = it[f]; };
    set('u', mem.u); set('p', mem.p); refreshTotals(); return;
  }
  if (el.dataset.taxbool){ setTax(el.dataset.taxbool, el.checked); return; }
  if (el.dataset.tax){ const v = Math.max(0, parseFloat(el.value.replace(/,/g,''))||0); el.value = v?baht(v):''; markDirty({tax:ui.year}); }
});
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && document.getElementById('viewer')){ closeViewer(); return; } if (e.key==='Escape' && ui.sheet) closeSheet(); if (e.key==='Enter' && ui.sheet && (e.target.id==='shAmt'||e.target.id==='shDesc')){ e.preventDefault(); saveEntry(false); } });
const WIPE_PIN_SHA256 = 'b3943428559bf9392be8588f0ce4e5a53d5d0b189a21b16bf2726ca0411d63e6';
async function checkPin(el){
  const v = el ? el.value.trim() : '';
  if (!v) return false;
  try { const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('') === WIPE_PIN_SHA256; }
  catch(e){ return false; }
}
document.addEventListener('keydown', e=>{ if (e.key==='Enter' && e.target.id==='wipePin'){ e.preventDefault(); const b=document.querySelector('[data-act="wipeYes"]'); if (b) b.click(); } });
async function sendLink(){
  const el = document.getElementById('loginEmail'), msg = document.getElementById('loginMsg');
  const email = (el && el.value || '').trim().toLowerCase();
  const say = (t, ok) => { if (msg){ msg.style.color = ok ? 'var(--muted)' : 'var(--exp)'; msg.textContent = t; } };
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ say('ใส่อีเมลให้ถูกต้องก่อนนะ'); return; }
  if (!sbClient){ say('ยังเชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'); return; }
  say('กำลังส่ง…', true);
  let r; try { r = await sbClient.auth.signInWithOtp({email, options:{emailRedirectTo: IS_FILE ? WEB_URL : location.origin + location.pathname, shouldCreateUser:true}}); } catch(e){ r = {error:e}; }
  if (r.error){ say(/rate|second|too many|limit/i.test(String(r.error.message)) ? 'ส่งอีเมลบ่อยเกินไป รอสักครู่แล้วลองใหม่' : 'ส่งไม่สำเร็จ ลองใหม่อีกครั้ง'); return; }
  ui.auth = {step:'sent', email}; render();
}
async function verifyCode(){
  const el = document.getElementById('loginCode'), msg = document.getElementById('loginMsg'), token = (el && el.value || '').replace(/\s/g,'');
  if (!token){ if (msg) msg.textContent = 'ใส่รหัสจากอีเมลก่อนนะ'; return; }
  let r; try { r = await sbClient.auth.verifyOtp({email: ui.auth.email, token, type:'email'}); } catch(e){ r = {error:e}; }
  if (r.error){ if (msg) msg.textContent = 'รหัสไม่ถูกต้องหรือหมดอายุ ลองส่งใหม่'; return; }
  if (r.data && r.data.session) onSignedIn(r.data.session);
}
document.addEventListener('keydown', e=>{
  if (e.key!=='Enter') return;
  if (e.target.id==='loginEmail'){ e.preventDefault(); sendLink(); }
  if (e.target.id==='loginCode'){ e.preventDefault(); verifyCode(); }
  if (e.target.id==='memEmail'){ e.preventDefault(); const b = document.querySelector('[data-act="memAdd"]'); if (b) b.click(); }
});
function setTax(k, v, quiet){
  const y = ui.year; state.tax[y] = Object.assign(taxSet(y), {[k]:v});
  const r = document.getElementById('taxResult'); if (r) r.innerHTML = taxResult();
  const a = document.getElementById('allowSum'); if (a) a.textContent = baht(calcTax(y,'flat').allowTotal)+' บาท';
  if (!quiet) markDirty({tax:y}); else { state.savedAt = Date.now(); storeLocal(); }
}
function route(){
  const h = location.hash.replace('#','');
  ui.tab = ['overview','entries','tax','backup'].includes(h) ? h : 'overview';
  ui.confirmWipe = false; render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
})();
</script>
